{% extends 'horarios/base.html' %}

{% block title %}Formulario{% endblock %}

{% block content %}
<h1>Formulario</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
</form>
<script>
    (function () {
        const indefinite = document.getElementById('id_contrato_indefinido');
        const endDate = document.getElementById('id_contrato_hasta');

        if (!indefinite || !endDate) {
            return;
        }

        const updateState = () => {
            endDate.disabled = indefinite.checked;
            if (indefinite.checked) {
                endDate.value = '';
            }
        };

        indefinite.addEventListener('change', updateState);
        updateState();
    })();
</script>
{% endblock %}
